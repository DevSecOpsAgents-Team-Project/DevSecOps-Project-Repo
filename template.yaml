AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  OpsGuard — GuardDuty Finding 수신 후 MCP Orchestrator가 Runtime / Finance / Regulation Agent를
  호출하고, Slack 승인 흐름을 처리합니다. DynamoDB·S3·WAF IPSet·VPC Flow Log Role은 기존 리소스를 참조합니다.

Globals:
  Function:
    Timeout: 300
    MemorySize: 512
    Architectures:
      - x86_64

Parameters:
  AwsAccountId:
    Type: String
    Default: '836347236184'
    Description: AWS 계정 ID

  SlackChannel:
    Type: String
    Description: Slack 채널 ID (예 C0123456789). MCP가 Finance 폼을 전송할 채널.

  DynamoDbTableName:
    Type: String
    Default: AgentB_Response_History
    Description: Runtime Agent 롤백/이력 DynamoDB 테이블 이름 (기존 테이블 참조)

  DynamoDbTableArn:
    Type: String
    Default: arn:aws:dynamodb:ap-northeast-2:836347236184:table/AgentB_Response_History
    Description: Runtime Agent DynamoDB 테이블 ARN (기존 테이블 참조)

  RegulationJsonTableName:
    Type: String
    Default: Regulation_JSON
    Description: MCP가 Regulation 결과를 저장하고 Slack-Response가 읽는 DynamoDB 테이블 (기존 테이블 참조)

  S3LogBucketName:
    Type: String
    Default: mcp-security-logs-bucket
    Description: Runtime Agent S3 로깅 대상 버킷 (기존 버킷 참조)

  WafIpSetId:
    Type: String
    Default: 657906ea-7bc5-4c48-b500-6b2686fdb9d2
    Description: 기존 WAFv2 Regional IPSet ID

  WafIpSetName:
    Type: String
    Default: OpsGuard-Block-IPSet
    Description: 기존 WAFv2 Regional IPSet 이름

  WafScope:
    Type: String
    Default: REGIONAL
    AllowedValues:
      - REGIONAL
      - CLOUDFRONT
    Description: WAF IPSet 스코프

  VpcFlowLogRoleArn:
    Type: String
    Default: arn:aws:iam::836347236184:role/AgentB-FlowLog-Role
    Description: VPC Flow Logs용 기존 IAM Role ARN (PassRole 대상)

  VpcFlowLogGroup:
    Type: String
    Default: /aws/vpc/flowlogs
    Description: VPC Flow Logs CloudWatch Log Group 이름

  ChromaCollection:
    Type: String
    Default: csa_ccm_v4
    Description: Regulation Agent ChromaDB 컬렉션 이름

  OpenAiModel:
    Type: String
    Default: gpt-4o-mini
    Description: Regulation Agent OpenAI 모델

  RegulationImageTag:
    Type: String
    Default: latest
    Description: SAM build 시 ECR에 푸시할 Regulation Agent 이미지 태그

Resources:
  # ---------------------------------------------------------------------------
  # HTTP API — Slack Events
  # ---------------------------------------------------------------------------
  OpsGuardHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      Description: OpsGuard Slack 이벤트 수신용 HTTP API

  # ---------------------------------------------------------------------------
  # Finance Agent
  # ---------------------------------------------------------------------------
  FinanceAgentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: Finance_Agent
      Runtime: python3.11
      Handler: handler.lambda_handler
      CodeUri: DevSecOps-Finance_Agent/
      Description: 비용 분석 및 시뮬레이션 추천
      Environment:
        Variables:
          OPENAI_API_KEY: '{{resolve:secretsmanager:opsguard/openai:SecretString:OPENAI_API_KEY}}'
      Policies:
        - AWSLambdaBasicExecutionRole

  # ---------------------------------------------------------------------------
  # Regulation Agent (Container Image — ChromaDB RAG)
  # ---------------------------------------------------------------------------
  RegulationAgentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: Regulation_Agent_20260616
      PackageType: Image
      Description: ChromaDB 기반 규제/RAG 분석 (컨테이너 이미지)
      ImageConfig:
        Command:
          - lambda_function.lambda_handler
      Environment:
        Variables:
          CHROMA_COLLECTION: !Ref ChromaCollection
          OPENAI_API_KEY: '{{resolve:secretsmanager:opsguard/openai:SecretString:OPENAI_API_KEY}}'
          OPENAI_MODEL: !Ref OpenAiModel
      Policies:
        - AWSLambdaBasicExecutionRole
    Metadata:
      DockerTag: !Ref RegulationImageTag
      DockerContext: ./DevSecOps-Regulation_Agent
      Dockerfile: Dockerfile

  # ---------------------------------------------------------------------------
  # Runtime Agent
  # ---------------------------------------------------------------------------
  RuntimeAgentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: Runtime_Agent
      Runtime: python3.11
      Handler: lambda_function.lambda_handler
      CodeUri: DevSecOps-Runtime_Agent/
      Description: Level 1 자동 대응 및 Level 2/3 승인 후 대응
      Environment:
        Variables:
          DEFAULT_S3_LOG_BUCKET: !Ref S3LogBucketName
          S3_LOG_BUCKET: !Ref S3LogBucketName
          SLACK_WEBHOOK_URL: '{{resolve:secretsmanager:opsguard/slack:SecretString:SLACK_WEBHOOK_URL}}'
          VPC_FLOW_LOG_GROUP: !Ref VpcFlowLogGroup
          VPC_FLOW_ROLE_ARN: !Ref VpcFlowLogRoleArn
          WAF_IPSET_ID: !Ref WafIpSetId
          WAF_IPSET_NAME: !Ref WafIpSetName
          WAF_SCOPE: !Ref WafScope
          DB_TABLE_NAME: !Ref DynamoDbTableName
      Policies:
        - AWSLambdaBasicExecutionRole
        - Version: '2012-10-17'
          Statement:
            - Sid: DynamoDbResponseHistory
              Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:GetItem
                - dynamodb:Query
              Resource: !Ref DynamoDbTableArn
            - Sid: IamMitigation
              Effect: Allow
              Action:
                - iam:ListAccessKeys
                - iam:UpdateAccessKey
                - iam:PutUserPolicy
                - iam:DetachUserPolicy
                - iam:ListAttachedUserPolicies
                - iam:TagUser
                - iam:AttachUserPolicy
                - iam:DeleteUserPolicy
              Resource: '*'
            - Sid: Ec2Mitigation
              Effect: Allow
              Action:
                - ec2:DescribeInstances
                - ec2:ModifyInstanceAttribute
                - ec2:StopInstances
                - ec2:StartInstances
                - ec2:CreateSnapshot
                - ec2:DeleteSnapshot
                - ec2:CreateImage
                - ec2:DeregisterImage
                - ec2:DescribeSecurityGroups
                - ec2:CreateSecurityGroup
                - ec2:RevokeSecurityGroupEgress
                - ec2:CreateTags
                - ec2:CreateFlowLogs
                - ec2:DeleteFlowLogs
                - ec2:DescribeFlowLogs
              Resource: '*'
            - Sid: S3Mitigation
              Effect: Allow
              Action:
                - s3:PutBucketLogging
                - s3:GetBucketLogging
                - s3:PutBucketTagging
                - s3:CreateBucket
                - s3:ListBucket
                - s3:GetBucketPublicAccessBlock
                - s3:PutPublicAccessBlock
              Resource:
                - !Sub arn:aws:s3:::${S3LogBucketName}
                - !Sub arn:aws:s3:::${S3LogBucketName}/*
                - arn:aws:s3:::*
            - Sid: WafIpBlock
              Effect: Allow
              Action:
                - wafv2:GetIPSet
                - wafv2:UpdateIPSet
              Resource:
                - !Sub arn:aws:wafv2:${AWS::Region}:${AwsAccountId}:${WafScope}/ipset/${WafIpSetName}/${WafIpSetId}
            - Sid: VpcFlowLogsPassRole
              Effect: Allow
              Action:
                - iam:PassRole
              Resource: !Ref VpcFlowLogRoleArn
              Condition:
                StringEquals:
                  iam:PassedToService: vpc-flow-logs.amazonaws.com
            - Sid: CloudTrailLookup
              Effect: Allow
              Action:
                - cloudtrail:LookupEvents
              Resource: '*'

  # ---------------------------------------------------------------------------
  # MCP Orchestrator
  # ---------------------------------------------------------------------------
  McpFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: MCP
      Runtime: python3.11
      Handler: lambda_function.lambda_handler
      CodeUri: DevSecOps-MCP/src/MCP/
      Description: GuardDuty Finding 수신 후 Runtime / Finance / Regulation Agent 오케스트레이션
      Environment:
        Variables:
          FINANCE_ARN: !GetAtt FinanceAgentFunction.Arn
          REGULATION_ARN: !GetAtt RegulationAgentFunction.Arn
          RUNTIME_ARN: !GetAtt RuntimeAgentFunction.Arn
          SLACK_BOT_TOKEN: '{{resolve:secretsmanager:opsguard/slack:SecretString:SLACK_BOT_TOKEN}}'
          SLACK_CHANNEL: !Ref SlackChannel
      Policies:
        - AWSLambdaBasicExecutionRole
        - Version: '2012-10-17'
          Statement:
            - Sid: InvokeDownstreamAgents
              Effect: Allow
              Action: lambda:InvokeFunction
              Resource:
                - !GetAtt RuntimeAgentFunction.Arn
                - !GetAtt FinanceAgentFunction.Arn
                - !GetAtt RegulationAgentFunction.Arn
                - !GetAtt McpSlackResponseFunction.Arn
            - Sid: RegulationJsonStore
              Effect: Allow
              Action:
                - dynamodb:PutItem
              Resource: !Sub arn:aws:dynamodb:${AWS::Region}:${AwsAccountId}:table/${RegulationJsonTableName}
      Events:
        GuardDutyFinding:
          Type: EventBridgeRule
          Properties:
            RuleName: guardduty-to-mcp
            Description: GuardDuty finding 발생 시 MCP orchestrator 실행
            EventBusName: default
            Pattern:
              source:
                - aws.guardduty
              detail-type:
                - GuardDuty Finding
              # -------------------------------------------------------------------
              # [선택] severity >= 7 (HIGH/CRITICAL)만 처리하려면 아래 detail 블록의
              # 주석을 해제하고 위 source/detail-type 과 함께 사용하세요.
              # -------------------------------------------------------------------
              # detail:
              #   severity:
              #     - numeric:
              #         - '>='
              #         - 7

  # ---------------------------------------------------------------------------
  # MCP Slack Response
  # ---------------------------------------------------------------------------
  McpSlackResponseFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: MCP-Slack-Response
      # AWS Lambda는 Python 3.14 미지원 (2026-06 기준). 콘솔 표기와 무관하게 3.11 사용.
      Runtime: python3.11
      Handler: lambda_function.lambda_handler
      CodeUri: DevSecOps-MCP/src/MCP-Slack-Response/
      Description: Slack 승인/응답 이벤트 처리
      Environment:
        Variables:
          FINANCE_ARN: !GetAtt FinanceAgentFunction.Arn
          RUNTIME_ARN: !GetAtt RuntimeAgentFunction.Arn
      Policies:
        - AWSLambdaBasicExecutionRole
        - Version: '2012-10-17'
          Statement:
            - Sid: InvokeAgents
              Effect: Allow
              Action: lambda:InvokeFunction
              Resource:
                - !GetAtt RuntimeAgentFunction.Arn
                - !GetAtt FinanceAgentFunction.Arn
            - Sid: RegulationJsonRead
              Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource: !Sub arn:aws:dynamodb:${AWS::Region}:${AwsAccountId}:table/${RegulationJsonTableName}
      Events:
        SlackEvents:
          Type: HttpApi
          Properties:
            ApiId: !Ref OpsGuardHttpApi
            Path: /slack/events
            Method: ANY

Outputs:
  SlackEventsApiUrl:
    Description: Slack Events API 엔드포인트 (Slack App Request URL에 등록)
    Value: !Sub https://${OpsGuardHttpApi}.execute-api.${AWS::Region}.amazonaws.com/slack/events

  MCPFunctionArn:
    Description: MCP Orchestrator Lambda ARN
    Value: !GetAtt McpFunction.Arn
    Export:
      Name: !Sub ${AWS::StackName}-MCPFunctionArn

  RuntimeAgentFunctionArn:
    Description: Runtime Agent Lambda ARN
    Value: !GetAtt RuntimeAgentFunction.Arn
    Export:
      Name: !Sub ${AWS::StackName}-RuntimeAgentFunctionArn

  FinanceAgentFunctionArn:
    Description: Finance Agent Lambda ARN
    Value: !GetAtt FinanceAgentFunction.Arn
    Export:
      Name: !Sub ${AWS::StackName}-FinanceAgentFunctionArn

  RegulationAgentFunctionArn:
    Description: Regulation Agent Lambda ARN
    Value: !GetAtt RegulationAgentFunction.Arn
    Export:
      Name: !Sub ${AWS::StackName}-RegulationAgentFunctionArn

  OpsGuardHttpApiId:
    Description: HTTP API Gateway ID
    Value: !Ref OpsGuardHttpApi
